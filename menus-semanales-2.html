<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Menús">
<title>Mis Menús</title>
<style>
:root{
  --bg:#fff;--bg2:#f5f5f7;--bg3:#e8e8ed;--bg4:#d1d1d6;
  --text:#1c1c1e;--text2:#3a3a3c;--text3:#8e8e93;
  --accent:#1c7a4a;--accent-bg:#e8f5ee;
  --blue:#0071e3;--blue-bg:#e8f1fb;
  --orange:#bf5700;--orange-bg:#fef3e8;
  --sep:#e5e5ea;--r:14px;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,34px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Text',sans-serif;overflow:hidden}

/* SPLASH */
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
.sp-icon{width:72px;height:72px;background:#1c7a4a;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:16px}
.sp-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.5px}
.sp-sub{color:var(--text3);font-size:14px;margin-top:4px}
.sp-loader{margin-top:32px;width:100px;height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.sp-bar{height:100%;width:0;background:var(--accent);border-radius:2px;animation:load 1.4s ease forwards}
@keyframes load{to{width:100%}}

/* APP */
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}

/* HEADER */
.hdr{
  padding:calc(var(--safe-top) + 4px) 16px 0;
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep);
  flex-shrink:0;
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.hdr-title{font-size:20px;font-weight:700;letter-spacing:-.3px}
.hdr-badge{background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}

/* WEEK TABS */
.wscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.wscroll::-webkit-scrollbar{display:none}
.wbtn{flex-shrink:0;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--sep);background:var(--bg);color:var(--text3);cursor:pointer;transition:all .15s}
.wbtn.active{background:var(--text);border-color:var(--text);color:#fff;font-weight:600}

/* VIEW TABS */
.vtabs{display:flex;background:var(--bg2);margin:10px 16px;border-radius:10px;padding:2px;flex-shrink:0}
.vtab{flex:1;padding:7px;text-align:center;border-radius:8px;font-size:13px;font-weight:500;color:var(--text3);background:transparent;border:none;cursor:pointer;transition:all .15s}
.vtab.active{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--safe-bot) + 16px)}

/* DAY NAV */
.daynav{display:flex;gap:6px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.daynav::-webkit-scrollbar{display:none}
.dbtn{flex-shrink:0;min-width:52px;padding:8px 6px;border-radius:12px;background:var(--bg);border:1px solid var(--sep);cursor:pointer;text-align:center;transition:all .15s}
.dbtn .ds{display:block;font-size:10px;font-weight:600;color:var(--text3);margin-bottom:1px;letter-spacing:.04em;text-transform:uppercase}
.dbtn .dn{display:block;font-size:13px;font-weight:600;color:var(--text2)}
.dbtn.active{background:var(--text);border-color:var(--text)}
.dbtn.active .ds,.dbtn.active .dn{color:#fff}
.dbtn.weekend{border-color:var(--accent-bg)}
.dbtn.weekend .ds{color:var(--accent)}
.dbtn.weekend.active{background:var(--accent);border-color:var(--accent)}

/* STATS */
.stats{display:flex;gap:8px;padding:0 16px 12px}
.scard{flex:1;background:var(--bg2);border-radius:12px;padding:10px 12px}
.scard .sl{font-size:11px;color:var(--text3);margin-bottom:2px}
.scard .sv{font-size:17px;font-weight:700;color:var(--text)}
.scard .su{font-size:11px;font-weight:400;color:var(--text3)}

/* MEALS */
.mlist{padding:0 16px;display:flex;flex-direction:column;gap:1px;background:var(--sep);border-radius:var(--r);overflow:hidden;margin:0 16px}
.mcard{background:#fff;padding:14px 16px}
.mcard:first-child{border-radius:var(--r) var(--r) 0 0}
.mcard:last-child{border-radius:0 0 var(--r) var(--r)}
.mcard:only-child{border-radius:var(--r)}
.mmeta{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.mtype{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text3)}
.mbadge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.bp{background:var(--orange-bg);color:var(--orange)}
.bt{background:var(--blue-bg);color:var(--blue)}
.bc{background:var(--accent-bg);color:var(--accent)}
.mname{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-.2px;margin-bottom:3px}
.mdesc{font-size:13px;color:var(--text3);line-height:1.5}
.mfoot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--sep)}
.mmacros{font-size:12px;color:var(--text3)}
.mmacros span{color:var(--text2);font-weight:600}
.rtoggle{font-size:13px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;padding:0}

/* RECIPE */
.rpanel{display:none;margin-top:12px;padding:12px;background:var(--bg2);border-radius:10px}
.rpanel.open{display:block}
.rlabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:6px}
.ichips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.ichip{font-size:12px;padding:3px 9px;background:#fff;border:1px solid var(--sep);border-radius:20px;color:var(--text2)}
.step{display:flex;gap:10px;margin-bottom:8px}
.snum{width:20px;height:20px;background:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}
.stxt{font-size:13px;color:var(--text2);line-height:1.5}

/* TIP */
.tip{margin:12px 16px 0;padding:12px 14px;background:var(--accent-bg);border-radius:12px;font-size:13px;color:var(--text2);line-height:1.5}
.tip strong{color:var(--accent)}

/* SHOP */
.shopprog{margin:0 16px 12px;padding:12px 14px;background:var(--bg2);border-radius:12px}
.shopprog-top{display:flex;justify-content:space-between;margin-bottom:8px}
.shopprog-lbl{font-size:13px;color:var(--text2);font-weight:500}
.shopprog-cnt{font-size:13px;font-weight:700;color:var(--accent)}
.progbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden}
.progfill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s}

.shopsec{margin:0 16px 8px;background:#fff;border-radius:var(--r);border:1px solid var(--sep);overflow:hidden}
.shopcat{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);padding:10px 16px 8px;border-bottom:1px solid var(--sep);background:var(--bg2)}
.shopitem{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--sep);cursor:pointer;transition:background .1s}
.shopitem:last-child{border-bottom:none}
.shopitem:active{background:var(--bg2)}
.shopitem.done{opacity:.45}
.checkc{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bg4);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s}
.shopitem.done .checkc{background:var(--accent);border-color:var(--accent)}
.shopitem-name{flex:1;font-size:15px;color:var(--text)}
.shopitem.done .shopitem-name{text-decoration:line-through;color:var(--text3)}
.tarrotag{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:5px;margin-left:5px;background:var(--orange-bg);color:var(--orange);vertical-align:middle}
.shopitem-qty{font-size:13px;color:var(--text3)}
.clearbtn{width:calc(100% - 32px);margin:4px 16px 0;padding:13px;background:var(--bg2);border:1px solid var(--sep);border-radius:12px;color:#c00;font-size:15px;font-weight:500;cursor:pointer}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-icon">🥗</div>
  <div class="sp-title">Mis Menús</div>
  <div class="sp-sub">6 semanas · 1500 kcal · ~110g proteína</div>
  <div class="sp-loader"><div class="sp-bar"></div></div>
</div>

<div id="app" style="display:none">
  <div class="hdr">
    <div class="hdr-top">
      <div class="hdr-title" id="htitle">Semana 1</div>
      <div class="hdr-badge" id="hbadge">Lunes</div>
    </div>
    <div class="wscroll" id="wscroll"></div>
  </div>

  <div style="flex-shrink:0;padding:10px 16px 0">
    <div class="vtabs">
      <button class="vtab active" onclick="setView('menu')">Menú semanal</button>
      <button class="vtab" onclick="setView('shop')">Lista de la compra</button>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div id="vmenu">
      <div class="stats" id="stats"></div>
      <div class="daynav" id="daynav"></div>
      <div id="mlist"></div>
    </div>
    <div id="vshop" style="display:none">
      <div class="shopprog">
        <div class="shopprog-top">
          <span class="shopprog-lbl">Productos comprados</span>
          <span class="shopprog-cnt" id="pcnt">0 / 0</span>
        </div>
        <div class="progbar"><div class="progfill" id="pfill" style="width:0%"></div></div>
      </div>
      <div id="shoplist"></div>
      <button class="clearbtn" onclick="clearShop()">Desmarcar todo</button>
    </div>
  </div>
</div>

<script>

const BL={prep:'Noche anterior',tupper:'Tupper',casa:'En casa',fuera:'Fuera'};
const BC={prep:'bp',tupper:'bt',casa:'bc',fuera:'bc'};

const W=[
{name:'Semana 1',kcal:1500,prot:108,tip:'Prepara el pollo y el salmón el domingo. El overnight oats se hace en 2 min la noche anterior.',
days:[
// LUNES
{meals:[
{type:'Desayuno',name:'Overnight oats con yogur',b:'prep',kcal:320,prot:22,desc:'Avena, yogur griego, plátano y canela en tarro.',i:['50g avena','150g yogur griego','1 plátano','canela'],s:['Mezcla la avena con el yogur en un tarro.','Añade el plátano en rodajas y la canela.','Tapa y deja en la nevera toda la noche.']},
{type:'Tupper',name:'Pollo al limón con arroz',b:'tupper',kcal:450,prot:42,desc:'Pechuga a la plancha, tarro de arroz integral, brócoli al vapor.',i:['150g pechuga pollo','1 tarro arroz integral','100g brócoli','zumo de limón','sal, aceite'],s:['Salpimienta la pechuga y cocínala a la plancha 4 min por lado.','Calienta el brócoli al vapor 3 min.','Monta el tupper con el arroz, el pollo en tiras y el brócoli.']},

let aw=0,ad=0,av='menu',chk={};
const BL2={prep:'Noche anterior',tupper:'Tupper',casa:'En casa',fuera:'Fuera'};
const BC2={prep:'bp',tupper:'bt',casa:'bc',fuera:'bc'};

function init(){
  setTimeout(()=>{
    const sp=document.getElementById('splash');
    sp.style.opacity='0';
    setTimeout(()=>{sp.style.display='none';document.getElementById('app').style.display='flex';renderWks();renderMenu();},400);
  },1600);
}

function renderWks(){
  document.getElementById('wscroll').innerHTML=W.map((w,i)=>
    `<button class="wbtn${i===aw?' active':''}" onclick="selW(${i})">${w.name}</button>`
  ).join('');
}

function selW(i){aw=i;ad=0;document.getElementById('scroll').scrollTop=0;renderWks();av==='menu'?renderMenu():(document.getElementById('hbadge').textContent='Compra',renderShop());}

function setView(v){
  av=v;
  document.getElementById('vmenu').style.display=v==='menu'?'':'none';
  document.getElementById('vshop').style.display=v==='shop'?'':'none';
  document.querySelectorAll('.vtab').forEach((t,i)=>t.classList.toggle('active',(i===0&&v==='menu')||(i===1&&v==='shop')));
  document.getElementById('scroll').scrollTop=0;
  v==='menu'?(document.getElementById('hbadge').textContent=DAYS[ad],renderMenu()):(document.getElementById('hbadge').textContent='Compra',renderShop());
}

function renderMenu(){
  const w=W[aw];
  document.getElementById('htitle').textContent=w.name;
  document.getElementById('hbadge').textContent=DAYS[ad];
  document.getElementById('stats').innerHTML=`
    <div class="scard"><div class="sl">Calorías/día</div><div class="sv">${w.kcal}<span class="su"> kcal</span></div></div>
    <div class="scard"><div class="sl">Proteína/día</div><div class="sv">${w.prot}<span class="su"> g</span></div></div>
    <div class="scard"><div class="sl">Comidas/día</div><div class="sv">4<span class="su"> tomas</span></div></div>
  `;
  document.getElementById('daynav').innerHTML=DAYS.map((d,i)=>
    `<button class="dbtn${i===ad?' active':''}${WEEKEND[i]?' weekend':''}" onclick="selD(${i})"><span class="ds">${DS[i]}</span><span class="dn">${d.slice(0,3)}</span></button>`
  ).join('');
  renderMeals();
}

function selD(i){
  ad=i;
  document.querySelectorAll('.dbtn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.getElementById('hbadge').textContent=DAYS[i];
  document.getElementById('scroll').scrollTop=0;
  renderMeals();
}

function renderMeals(){
  const meals=W[aw].days[ad].meals;
  const tip=W[aw].tip;
  document.getElementById('mlist').innerHTML=
    `<div class="mlist">${meals.map(m=>`
    <div class="mcard">
      <div class="mmeta"><span class="mtype">${m.type}</span><span class="mbadge ${BC2[m.b]}">${BL2[m.b]}</span></div>
      <div class="mname">${m.name}</div>
      <div class="mdesc">${m.desc}</div>
      <div class="mfoot">
        <span class="mmacros"><span>${m.kcal}</span> kcal · <span>${m.prot}g</span> prot</span>
        <button class="rtoggle" onclick="togR(this)">Ver receta</button>
      </div>
      <div class="rpanel">
        <div class="rlabel">Ingredientes</div>
        <div class="ichips">${m.i.map(x=>`<span class="ichip">${x}</span>`).join('')}</div>
        <div class="rlabel">Preparación</div>
        ${m.s.map((s,j)=>`<div class="step"><div class="snum">${j+1}</div><div class="stxt">${s}</div></div>`).join('')}
      </div>
    </div>`).join('')}</div>
    <div class="tip"><strong>Tip de la semana:</strong> ${tip}</div>`;
}

function togR(btn){
  const p=btn.closest('.mcard').querySelector('.rpanel');
  const o=p.classList.toggle('open');
  btn.textContent=o?'Ocultar':'Ver receta';
}

function renderShop(){
  document.getElementById('htitle').textContent=W[aw].name;
  document.getElementById('hbadge').textContent='Compra';
  const key=`w${aw}`;
  if(!chk[key])chk[key]={};
  const shop=W[aw].shop;
  let tot=0,don=0,html='';
  for(const[cat,items]of Object.entries(shop)){
    html+=`<div class="shopsec"><div class="shopcat">${cat}</div>`;
    items.forEach((item,i)=>{
      const id=`${key}-${cat}-${i}`;const d=!!chk[key][id];
      if(d)don++;tot++;
      html+=`<div class="shopitem${d?' done':''}" onclick="togItem('${key}','${id}',this)">
        <div class="checkc">${d?`<svg width="10" height="8" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`:''}</div>
        <span class="shopitem-name">${item.n}${item.t?'<span class="tarrotag">tarro</span>':''}</span>
        <span class="shopitem-qty">${item.q}</span>
      </div>`;
    });
    html+='</div>';
  }
  document.getElementById('shoplist').innerHTML=html;
  document.getElementById('pcnt').textContent=`${don} / ${tot}`;
  document.getElementById('pfill').style.width=tot?`${Math.round(don/tot*100)}%`:'0%';
}

function togItem(key,id,el){
  chk[key][id]=!chk[key][id];const d=chk[key][id];
  el.classList.toggle('done',d);
  const c=el.querySelector('.checkc');
  c.style.background=d?'#1c7a4a':'';c.style.borderColor=d?'#1c7a4a':'';
  c.innerHTML=d?`<svg width="10" height="8" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`:'';
  const shop=W[aw].shop;let tot=0,don=0;
  for(const[cat,items]of Object.entries(shop)){items.forEach((_,i)=>{tot++;if(chk[key][`${key}-${cat}-${i}`])don++;});}
  document.getElementById('pcnt').textContent=`${don} / ${tot}`;
  document.getElementById('pfill').style.width=`${Math.round(don/tot*100)}%`;
}

function clearShop(){chk[`w${aw}`]={};renderShop();}
init();
</script>
</body>
</html>
