<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mis Menús">
<title>Mis Menús</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--text2:#3a3a3c;--text3:#8e8e93;
  --green:#1a6b40;--green-bg:#e4f2ea;
  --blue:#0064d2;--blue-bg:#e3eefc;
  --orange:#b85200;--orange-bg:#fdeee3;
  --sep:#e5e5ea;--r:14px;--red:#c00;--red-bg:#fdeaea;--green-light:#c8e6d4;
  --safe-top:env(safe-area-inset-top,44px);
  --safe-bot:env(safe-area-inset-bottom,34px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Text',sans-serif;overflow:hidden}

/* SPLASH */
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;transition:opacity .4s}
.sp-icon{width:80px;height:80px;background:var(--green);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:18px}
.sp-title{font-size:28px;font-weight:700;letter-spacing:-.5px;color:var(--text)}
.sp-sub{color:var(--text3);font-size:15px;margin-top:5px}
.sp-bar-wrap{margin-top:36px;width:120px;height:3px;background:#e5e5ea;border-radius:2px;overflow:hidden}
.sp-bar{height:100%;width:0;background:var(--green);border-radius:2px;animation:load 1.5s ease forwards}
@keyframes load{to{width:100%}}

/* SCREENS */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.screen{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.screen.active{display:block}

/* ===== HEADER ===== */
.top-bar{
  position:sticky;top:0;z-index:50;
  padding:calc(var(--safe-top) + 4px) 16px 0;
  background:rgba(242,242,247,.94);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--sep);
  flex-shrink:0;
}
.top-bar-row1{display:flex;align-items:center;gap:10px;padding-bottom:12px}
.back-btn{font-size:28px;color:var(--blue);background:none;border:none;cursor:pointer;line-height:1;padding:0 6px 0 0;display:none}
.back-btn.show{display:block}
.top-bar-titles{flex:1;min-width:0}
.top-bar-theme{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:2px}
.top-bar-week{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
.top-bar-badge{background:var(--green-bg);color:var(--green);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap;flex-shrink:0}

/* DAY NAV */
.day-nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.day-nav::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;min-width:50px;padding:7px 4px;border-radius:12px;background:var(--card);border:none;cursor:pointer;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.day-btn .ds{display:block;font-size:9px;font-weight:800;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.day-btn .dn{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-top:1px}
.day-btn.active{background:var(--text);box-shadow:none}
.day-btn.active .ds,.day-btn.active .dn{color:#fff}
.day-btn.wknd.active{background:var(--green)}

/* SECTION TABS (within week) */
.sec-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.sec-tabs::-webkit-scrollbar{display:none}
.sec-tab{flex-shrink:0;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:600;border:none;cursor:pointer;background:var(--card);color:var(--text3);box-shadow:0 1px 3px rgba(0,0,0,.07)}
.sec-tab.active{background:var(--text);color:#fff}

/* KCAL SWITCHER */

/* ===== HOME ===== */
.home-pad{padding:20px 16px 28px}
.home-title{font-size:30px;font-weight:800;letter-spacing:-.6px;margin-bottom:4px}
.home-sub{font-size:16px;color:var(--text3);margin-bottom:8px}
.week-cards{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.wcard{background:var(--card);border-radius:20px;padding:20px;cursor:pointer;transition:transform .1s;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.wcard:active{transform:scale(.98)}
.wcard-num{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:6px}
.wcard-theme{font-size:14px;font-weight:700;color:var(--green);margin-bottom:4px}
.wcard-title{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--text);margin-bottom:6px}
.wcard-desc{font-size:14px;color:var(--text3);line-height:1.55;margin-bottom:14px}
.wcard-bottom{display:flex;align-items:center;justify-content:space-between}
.wcard-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.b{background:var(--blue-bg);color:var(--blue)}
.pill.o{background:var(--orange-bg);color:var(--orange)}
.wcard-arrow{font-size:22px;color:var(--text3);flex-shrink:0;margin-left:8px}

/* ===== MENU TAB ===== */
.stats-row{display:flex;gap:10px;padding:16px 16px 0}
.scard{flex:1;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.scard-l{font-size:11px;color:var(--text3);margin-bottom:3px}
.scard-v{font-size:20px;font-weight:800;color:var(--text)}
.scard-u{font-size:11px;font-weight:500;color:var(--text3)}
.meals-list{padding:14px 16px 0;display:flex;flex-direction:column;gap:14px}
.mc{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.mc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mc-type{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text3)}
.mc-badge{font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.bp{background:var(--orange-bg);color:var(--orange)}
.bt{background:var(--blue-bg);color:var(--blue)}
.bc{background:var(--green-bg);color:var(--green)}
.mc-name{font-size:18px;font-weight:800;letter-spacing:-.3px;color:var(--text);margin-bottom:5px}
.mc-desc{font-size:14px;color:var(--text3);line-height:1.55}
.mc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--sep)}
.mc-macros{font-size:13px;color:var(--text3)}
.mc-macros b{color:var(--text2);font-weight:700}
.mc-rec-btn{font-size:14px;font-weight:700;color:var(--blue);background:none;border:none;cursor:pointer}
.rec-panel{display:none;margin-top:14px;padding:14px;background:var(--bg);border-radius:12px}
.rec-panel.open{display:block}
.rec-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:8px}
.ichips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ichip{font-size:13px;padding:5px 11px;background:var(--card);border-radius:20px;color:var(--text2);font-weight:500}
.step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.snum{width:22px;height:22px;min-width:22px;background:var(--text);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:1px}
.stxt{font-size:14px;color:var(--text2);line-height:1.55}
.tip-box{margin:16px 16px 24px;padding:16px;background:var(--green-bg);border-radius:16px}
.tip-box-lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:5px}
.tip-box-txt{font-size:14px;color:var(--text2);line-height:1.6}
.snack-adapt{background:var(--orange-bg);border-radius:14px;padding:14px 16px;border-left:3px solid var(--orange)}
.snack-adapt-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--orange);margin-bottom:4px}
.snack-adapt-txt{font-size:13px;color:var(--text2);line-height:1.5}
.ov-wrap{padding:14px 16px 28px}
.ov-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:10px}
.ov-table{border-collapse:collapse;min-width:560px;width:100%;background:var(--card);border-radius:16px;overflow:hidden}
.ov-table th{background:var(--text);color:#fff;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;text-align:center;white-space:nowrap}
.ov-table th:first-child{background:var(--green);text-align:left;padding-left:12px}
.ov-table td{padding:9px 8px;vertical-align:top;border-bottom:1px solid var(--sep);font-size:12px;text-align:center;line-height:1.4}
.ov-table td:first-child{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--bg);text-align:left;padding-left:12px;white-space:nowrap}
.ov-table tr:last-child td{border-bottom:none}
.ov-cell{font-size:12px;color:var(--text2);line-height:1.4}
.ov-cell-batch{color:var(--green);font-weight:600}
.ov-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text3);margin-bottom:18px}
.ov-legend span{display:flex;align-items:center;gap:4px}
.ov-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ov-section-title{font-size:16px;font-weight:800;letter-spacing:-.2px;margin-bottom:10px;padding-top:4px}
.batch-tracker{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.bt-title{font-size:15px;font-weight:800;margin-bottom:6px;letter-spacing:-.2px}
.bt-item{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--sep)}
.bt-item:last-child{border-bottom:none}
.bt-name{font-size:14px;font-weight:700}
.bt-sub{font-size:12px;color:var(--text3);font-weight:400;display:block;margin-top:2px}
.bt-counter{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:2px}
.bt-minus,.bt-plus{width:30px;height:30px;border-radius:50%;border:none;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.bt-minus{color:#c00}.bt-plus{color:var(--green)}
.bt-count{font-size:18px;font-weight:800;min-width:28px;text-align:center}
.persons-note{padding:10px 14px;background:var(--blue-bg);border-radius:12px;font-size:13px;color:var(--blue);font-weight:600;margin-bottom:10px}

/* ===== BATCH TAB ===== */
.batch-wrap{padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
.batch-intro{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.batch-intro p{font-size:14px;color:var(--text2);line-height:1.6}
.batch-intro p b{color:var(--text)}
.batch-sec{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.batch-sec-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.batch-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ico-g{background:var(--green-bg)}
.ico-b{background:var(--blue-bg)}
.ico-o{background:var(--orange-bg)}
.batch-sec-name{font-size:17px;font-weight:800;letter-spacing:-.2px;color:var(--text)}
.batch-sec-time{font-size:13px;color:var(--text3);margin-top:1px}
.batch-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--sep)}
.batch-item:last-child{border-bottom:none;padding-bottom:0}
.bdot{width:7px;height:7px;min-width:7px;border-radius:50%;background:var(--green);margin-top:6px}
.btxt{font-size:14px;color:var(--text2);line-height:1.6}
.btxt b{color:var(--text);font-weight:700}

/* ===== SHOP TAB ===== */
.shop-wrap{padding:16px 16px 28px}
.prog-card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.prog-lbl{font-size:15px;font-weight:700;color:var(--text)}
.prog-cnt{font-size:15px;font-weight:800;color:var(--green)}
.prog-bar{height:4px;background:var(--sep);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.shop-secs{display:flex;flex-direction:column;gap:12px}
.shop-sec{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.shop-cat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:12px 16px 10px;background:var(--bg);border-bottom:1px solid var(--sep)}
.shop-item{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid var(--sep);cursor:pointer}
.shop-item:last-child{border-bottom:none}
.shop-item:active{background:var(--bg)}
.shop-item.done{opacity:.38}
.chk{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sep);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
.shop-item.done .chk{background:var(--green);border-color:var(--green)}
.iname{flex:1;font-size:15px;font-weight:500;color:var(--text)}
.shop-item.done .iname{text-decoration:line-through;color:var(--text3)}
.tarro{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;padding:1px 6px;border-radius:5px;margin-left:6px;background:var(--orange-bg);color:var(--orange);vertical-align:middle}
.iqty{font-size:13px;color:var(--text3);white-space:nowrap}
.clr-btn{width:100%;margin-top:12px;padding:14px;background:var(--card);border:none;border-radius:14px;color:#c00;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.06)}
</style>
</head>
<body>

<div id="splash">
  <div class="sp-icon">🥗</div>
  <div class="sp-title">Mis Menús</div>
  <div class="sp-sub">6 semanas · 1×1500 + 2×1300 kcal</div>
  <div class="sp-bar-wrap"><div class="sp-bar"></div></div>
</div>

<div id="app" style="display:none;height:100%;flex-direction:column">

  <!-- STICKY TOP BAR -->
  <div class="top-bar" id="top-bar">
    <div class="top-bar-row1">
      <button class="back-btn" id="back-btn" onclick="goHome()">‹</button>
      <div class="top-bar-titles">
        <div class="top-bar-theme" id="top-theme" style="display:none"></div>
        <div class="top-bar-week" id="top-week">Mis Menús</div>
      </div>
      <div class="top-bar-badge" id="top-badge" style="display:none"></div>
    </div>
    <div class="day-nav" id="day-nav" style="display:none"></div>
  </div>

  <!-- HOME SCREEN -->
  <div class="screen active" id="screen-home">

    <div class="home-pad">
      <div class="home-title">Hola, Maria 👋</div>
      <div class="home-sub">Elige una semana para empezar</div>
      <div class="week-cards" id="week-cards"></div>
    </div>
  </div>

  <!-- WEEK SCREEN -->
  <div class="screen" id="screen-week">
    <div class="sec-tabs" id="sec-tabs">
      <button class="sec-tab active" onclick="setSecTab('menu')">Menu del dia</button>
      <button class="sec-tab" onclick="setSecTab('overview')">Vista semanal</button>
      <button class="sec-tab" onclick="setSecTab('batch')">Batch cooking</button>
      <button class="sec-tab" onclick="setSecTab('shop')">La compra</button>
    </div>
    <div id="sec-menu"></div>
    <div id="sec-overview" style="display:none"></div>
    <div id="sec-batch" style="display:none"></div>
    <div id="sec-shop" style="display:none"></div>
  </div>

</div>

<script>
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DS=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
const WKD=[0,0,0,0,0,1,1];
const BL={prep:'Noche anterior',tupper:'Tupper',casa:'En casa'};
const BC={prep:'bp',tupper:'bt',casa:'bc'};
let aw=0, ad=0, st='menu', chk={}, batchCount={};

// ── Persistencia localStorage ──
function saveState(){
  try{
    localStorage.setItem('menus_chk', JSON.stringify(chk));
    localStorage.setItem('menus_batch', JSON.stringify(batchCount));
  }catch(e){}
}
function loadState(){
  try{
    const c=localStorage.getItem('menus_chk');
    const b=localStorage.getItem('menus_batch');
    if(c) chk=JSON.parse(c);
    if(b) batchCount=JSON.parse(b);
  }catch(e){}
}

// ==================== DATA ====================
const W=[
{
  name:'Semana 1',theme:'Clásica y fácil',

    ]},
    {ico:'🥣',cl:'ico-b',name:'Prep noche del domingo',time:'15 min',items:[
      {t:'<b>2 tarros overnight oats</b> (para 1 persona — lunes y jueves): 50g avena + 150g yogur griego + canela en cada tarro. Nevera.'},
      {t:'<b>Hervir 8 huevos duros</b> y guardar con cáscara en la nevera (snack x1 pers mar/mie/jue/vie + extras para cenas).'},

    {ico:'🧊',cl:'ico-o',name:'Nevera lista',time:'5 min',items:[
      {t:'Corta pepino, zanahoria y apio en palitos. Guarda en un tarro con agua para que se mantengan crujientes.'},
      {t:'Abre y coloca visibles los <b>tarros de arroz, quinoa y lentejas</b> ya hechos, listos para calentar.'},{t:'<b>Brócoli al vapor:</b> cuece 300g brócoli en flores al vapor 5 min. Guarda en tupper (lunes tupper).'},{t:'<b>Judías verdes al vapor:</b> cuece 600g judías verdes 6 min. Guarda en tupper — la mitad para el martes (tupper salmón) y la otra mitad para la paella del sábado.'},{t:'<b>Espinacas salteadas:</b> saltea 700g espinacas con ajo y aceite 3 min en tandas. Guarda en tupper grande — para la tortilla del lunes (cena), el pollo al curry del miércoles (tupper), la pasta del viernes y la ternera del domingo.'},{t:'<b>Zanahoria cocida:</b> cuece 3 zanahorias enteras 12 min. Corta en rodajas — para las lentejas del martes (cena).'},
    ]},
  ],
  batchItems:[
    {name:'Pechuga de pollo',total:9,unit:'rac. (200g c/u)',
     days:['Tupper','','Tupper','','Desay.','','']},
    {name:'Overnight oats (1 pers)',total:2,unit:'tarros',
     days:['Desay.','','','Desay.','','','']},
    {name:'Huevos duros (snack x1)',total:8,unit:'huevos',
     days:['','Snack','Snack','Snack','Desay.','','']},
    {name:'Boniato asado',total:6,unit:'raciones (x3 pers)',
     days:['','Tupper','','','','Comida','']},
    {name:'Pimiento asado',total:2,unit:'tarros',
     days:['','','','Tupper','','Paella','']},
    {name:'Brócoli al vapor',total:3,unit:'raciones (x3 pers)',
     days:['Tupper','','','','','','']},
    {name:'Judías verdes al vapor',total:6,unit:'raciones (x3 pers)',
     days:['','Tupper','','','','Paella','']},
    {name:'Espinacas salteadas',total:9,unit:'raciones (x3 pers)',
     days:['Cena','','Tupper','','Comida','','Comida']},
    {name:'Zanahoria cocida',total:3,unit:'raciones (x3 pers)',
     days:['','Cena','','','','','']},
  ],
  days:[

// ==================== LOGIC ====================

function renderOverview(){
  const w=W[aw];
  const key='b'+aw;
  if(!batchCount[key]){
    batchCount[key]={};
    w.batchItems.forEach((b,i)=>batchCount[key][i]=b.total);
  }

  const DS_SHORT=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const USE_COLORS={
    'Tupper': {bg:'#e3eefc',fg:'#0064d2'},
    'Cena':   {bg:'#e4f2ea',fg:'#1a6b40'},
    'Desay.': {bg:'#fdeee3',fg:'#b85200'},
    'Comida': {bg:'#e4f2ea',fg:'#1a6b40'},
    'Snack':  {bg:'#f5f0ff',fg:'#6b3fa0'},
    'Paella': {bg:'#e4f2ea',fg:'#1a6b40'},
  };

  let html=`<div class="ov-wrap">
  <div class="ov-section-title">Plan de uso del batch</div>
  <p style="font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.5">Cada fila es una preparacion del domingo. Las columnas muestran cuando se usa cada dia. Usa los botones para ir restando raciones conforme las gastais.</p>
  <div class="ov-scroll">
  <table class="ov-table">
    <tr>
      <th style="min-width:120px;text-align:left;padding-left:12px">Preparacion</th>
      ${DS_SHORT.map((d,i)=>`<th style="${WKD[i]?'background:var(--green);color:#fff':'background:var(--text);color:#fff'};min-width:54px">${d}</th>`).join('')}
    </tr>`;

  w.batchItems.forEach((bi,bii)=>{
    const cur = batchCount[key][bii]!==undefined ? batchCount[key][bii] : bi.total;
    const pct = bi.total>0 ? Math.round(cur/bi.total*100) : 0;
    const barColor = pct>50?'var(--green)':pct>20?'var(--orange)':'var(--red)';

    html+=`<tr>
      <td style="background:var(--card);vertical-align:top;padding:10px 12px">
        <div style="font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px">${bi.name}</div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:6px">${cur} / ${bi.total} ${bi.unit}</div>
        <div style="height:3px;background:var(--sep);border-radius:2px;overflow:hidden;margin-bottom:8px">
          <div style="height:100%;width:${pct}%;background:${barColor};border-radius:2px;transition:width .3s"></div>
        </div>
        <div style="display:flex;gap:4px">
          <button onclick="adjBatch(${aw},${bii},-1)" style="flex:1;padding:5px 0;border-radius:8px;background:var(--red-bg);color:var(--red);border:none;font-size:16px;font-weight:800;cursor:pointer;line-height:1">−</button>
          <button onclick="adjBatch(${aw},${bii},1)" style="flex:1;padding:5px 0;border-radius:8px;background:var(--green-bg);color:var(--green);border:none;font-size:16px;font-weight:800;cursor:pointer;line-height:1">+</button>
        </div>
      </td>
      ${bi.days.map((use,di)=>{
        if(!use) return `<td style="background:${WKD[di]?'var(--green-bg)':'var(--card)'};vertical-align:middle;text-align:center"><span style="color:var(--sep);font-size:20px;line-height:1">·</span></td>`;
        const col=USE_COLORS[use]||{bg:'var(--green-bg)',fg:'var(--green)'};
        return `<td style="background:${WKD[di]?'var(--green-bg)':'var(--card)'};vertical-align:middle;text-align:center;padding:8px 4px">
          <span style="display:inline-block;background:${col.bg};color:${col.fg};font-size:11px;font-weight:800;padding:4px 6px;border-radius:8px;line-height:1.2">${use}</span>
        </td>`;
      }).join('')}
    </tr>`;
  });

  html+=`</table></div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px">
    ${Object.entries(USE_COLORS).map(([k,v])=>`<span style="display:flex;align-items:center;gap:5px"><span style="display:inline-block;background:${v.bg};color:${v.fg};font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px">${k}</span></span>`).join('')}
    <span style="color:var(--text3)">· = no se usa ese dia</span>
  </div>
  </div>`;

  document.getElementById('sec-overview').innerHTML=html;
}

function adjBatch(wi,bi,delta){
  const key=`b${wi}`;
  if(!batchCount[key]){batchCount[key]={};W[wi].batchItems.forEach((b,i)=>batchCount[key][i]=b.total);}
  const max=W[wi].batchItems[bi].total;
  batchCount[key][bi]=Math.max(0,Math.min(max,(batchCount[key][bi]||0)+delta));
  saveState();
  renderOverview();
}

function init(){
  setTimeout(()=>{
    document.getElementById('splash').style.opacity='0';
    setTimeout(()=>{
      document.getElementById('splash').style.display='none';
      document.getElementById('app').style.display='flex';
      loadState();
      renderHome();
    },400);
  },1600);
}

function renderHome(){
  document.getElementById('week-cards').innerHTML=W.map((w,i)=>`
    <div class="wcard" onclick="openWeek(${i})">
      <div class="wcard-num">Semana ${i+1} · 3 personas</div>
      <div class="wcard-theme">${w.theme}</div>
      <div class="wcard-title">${w.name}</div>
      <div class="wcard-desc">${w.desc}</div>
      <div class="wcard-bottom">
        <div class="wcard-pills">
          <span class="pill g">1500 kcal/pers</span>
          ${w.tags.map((t,ti)=>`<span class="pill ${ti===0?'b':'o'}">${t}</span>`).join('')}
        </div>
        <span class="wcard-arrow">›</span>
      </div>
    </div>
  `).join('');
}

function openWeek(i){
  aw=i; ad=0; st='menu';
  // switch screens
  document.getElementById('screen-home').classList.remove('active');
  document.getElementById('screen-week').classList.add('active');
  // update header
  document.getElementById('back-btn').classList.add('show');
  document.getElementById('top-theme').style.display='block';
  document.getElementById('top-theme').textContent=W[i].theme;
  document.getElementById('top-week').textContent=W[i].name;
  document.getElementById('top-badge').style.display='block';
  document.getElementById('top-badge').textContent=DAYS[0];
  // render day nav
  renderDayNav();
  // reset tabs
  document.querySelectorAll('.sec-tab').forEach((b,j)=>b.classList.toggle('active',j===0));
  ['sec-menu','sec-overview','sec-batch','sec-shop'].forEach((id,j)=>document.getElementById(id).style.display=j===0?'':'none');
  document.getElementById('day-nav').style.display='flex';
  renderMenuTab();
  document.getElementById('screen-week').scrollTop=0;
}

function goHome(){
  document.getElementById('screen-week').classList.remove('active');
  document.getElementById('screen-home').classList.add('active');
  document.getElementById('back-btn').classList.remove('show');
  document.getElementById('top-theme').style.display='none';
  document.getElementById('top-week').textContent='Mis Menús';
  document.getElementById('top-badge').style.display='none';
  document.getElementById('day-nav').style.display='none';
}

function renderDayNav(){
  document.getElementById('day-nav').innerHTML=DAYS.map((d,i)=>
    `<button class="day-btn${i===ad?' active':''}${WKD[i]?' wknd':''}" onclick="selDay(${i})">
      <span class="ds">${DS[i]}</span><span class="dn">${d.slice(0,3)}</span>
    </button>`
  ).join('');
}

function selDay(i){
  ad=i;
  document.querySelectorAll('.day-btn').forEach((b,j)=>b.classList.toggle('active',j===i));
  document.getElementById('top-badge').textContent=DAYS[i];
  renderMenuTab();
  document.getElementById('screen-week').scrollTop=0;
}

function setSecTab(t){
  st=t;
  const tabs=['menu','overview','batch','shop'];
  document.querySelectorAll('.sec-tab').forEach((b,j)=>b.classList.toggle('active',tabs[j]===t));
  tabs.forEach(id=>document.getElementById('sec-'+id).style.display=id===t?'':'none');
  document.getElementById('day-nav').style.display=t==='menu'?'flex':'none';
  const badgeMap={menu:DAYS[ad],overview:'Vista semanal',batch:'Batch',shop:'Compra'};
  document.getElementById('top-badge').textContent=badgeMap[t]||t;
  if(t==='menu') renderMenuTab();
  else if(t==='overview') renderOverview();
  else if(t==='batch') renderBatchTab();
  else renderShopTab();
  document.getElementById('screen-week').scrollTop=0;
}

function renderMenuTab(){
  const w=W[aw];
  const meals=w.days[ad].meals;
  const totProt=meals.reduce((a,m)=>a+m.prot,0);
  let html=`<div class="stats-row">
    <div class="scard"><div class="scard-l">Plan</div><div class="scard-v" style="font-size:13px;line-height:1.3">1×1500<br><span style="font-size:11px;color:var(--text3)">2×1300 kcal</span></div></div>
    <div class="scard"><div class="scard-l">Total grupo</div><div class="scard-v">4100<span class="scard-u"> kcal</span></div></div>
    <div class="scard"><div class="scard-l">Personas</div><div class="scard-v">3<span class="scard-u"> pers.</span></div></div>
  </div>`;
  html+=`<div class="meals-list">`;
  meals.forEach(m=>{
    html+=`<div class="mc">
      <div class="mc-top"><span class="mc-type">${m.type}</span><span class="mc-badge ${BC[m.b]}">${BL[m.b]}</span></div>
      <div class="mc-name">${m.name}</div>
      <div class="mc-desc">${m.desc}</div>
      <div class="mc-foot">
        <span class="mc-macros"><b>${m.kcal}</b> kcal · <b>${m.prot}g</b> prot</span>
        <button class="mc-rec-btn" onclick="togRec(this)">Ver receta</button>
      </div>
      <div class="rec-panel">
        <div class="rec-lbl">Ingredientes (1 persona)</div>
        <div class="ichips">${m.i.map(x=>`<span class="ichip">${x}</span>`).join('')}</div>
        <div class="rec-lbl">Preparacion</div>
        ${m.s.map((s,j)=>`<div class="step"><div class="snum">${j+1}</div><div class="stxt">${s}</div></div>`).join('')}
      </div>
    </div>`;
    if(m.sn){
      const adapt=m.adapt||'Para las 2 personas de 1300 kcal: no tomar este snack.';
      html+=`<div class="snack-adapt"><div class="snack-adapt-title">Solo 1 persona (plan 1500 kcal)</div><div class="snack-adapt-txt">${adapt} Las cantidades de ingredientes ya estan calculadas para 1 persona.</div></div>`;
    }
  });
  html+=`</div><div class="tip-box"><div class="tip-box-lbl">Tip de la semana</div><div class="tip-box-txt">${w.tip}</div></div>`;
  document.getElementById('sec-menu').innerHTML=html;
}

function togRec(btn){
  const p=btn.closest('.mc').querySelector('.rec-panel');
  const o=p.classList.toggle('open');
  btn.textContent=o?'Ocultar':'Ver receta';
}

function renderBatchTab(){
  const b=W[aw].batch;
  let html=`<div class="batch-wrap">
    <div class="batch-intro"><p>Dedica <b>~1 hora el domingo</b> para preparar lo siguiente. Ahorrarás tiempo toda la semana y solo tendrás que calentar y montar los tuppers.</p></div>`;
  b.forEach(sec=>{
    html+=`<div class="batch-sec">
      <div class="batch-sec-hdr">
        <div class="batch-ico ${sec.cl}">${sec.ico}</div>
        <div><div class="batch-sec-name">${sec.name}</div><div class="batch-sec-time">${sec.time}</div></div>
      </div>
      ${sec.items.map(it=>`<div class="batch-item"><div class="bdot"></div><div class="btxt">${it.t}</div></div>`).join('')}
    </div>`;
  });
  html+=`</div>`;
  document.getElementById('sec-batch').innerHTML=html;
}

function renderShopTab(){
  const key=`w${aw}`;
  if(!chk[key]) chk[key]={};
  const shop=W[aw].shop;
  let tot=0,don=0;
  let secsHtml='';
  for(const[cat,items]of Object.entries(shop)){
    secsHtml+=`<div class="shop-sec"><div class="shop-cat">${cat}</div>`;
    items.forEach((item,i)=>{
      const id=`${key}-${cat}-${i}`;
      const d=!!chk[key][id];
      if(d) don++;
      tot++;
      secsHtml+=`<div class="shop-item${d?' done':''}" onclick="togItem('${key}','${id}',this)">
        <div class="chk">${d?`<svg width="10" height="8" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`:''}</div>
        <span class="iname">${item.n}${item.t?'<span class="tarro">tarro</span>':''}</span>
        <span class="iqty">${item.q}</span>
      </div>`;
    });
    secsHtml+=`</div>`;
  }
  document.getElementById('sec-shop').innerHTML=`<div class="shop-wrap"><div class="persons-note">3 personas · 1×1500 kcal + 2×1300 kcal · Snacks solo para 1 persona</div>
    <div class="prog-card">
      <div class="prog-top"><span class="prog-lbl">Productos comprados</span><span class="prog-cnt" id="pcnt">${don} / ${tot}</span></div>
      <div class="prog-bar"><div class="prog-fill" id="pfill" style="width:${tot?Math.round(don/tot*100):0}%"></div></div>
    </div>
    <div class="shop-secs">${secsHtml}</div>
    <button class="clr-btn" onclick="clearShop()">Desmarcar todo</button>
  </div>`;
}

function togItem(key,id,el){
  chk[key][id]=!chk[key][id];
  saveState();
  const d=chk[key][id];
  el.classList.toggle('done',d);
  const c=el.querySelector('.chk');
  c.style.background=d?'var(--green)':'';
  c.style.borderColor=d?'var(--green)':'';
  c.innerHTML=d?`<svg width="10" height="8" viewBox="0 0 10 8"><polyline points="1,4 4,7 9,1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`:'';
  const shop=W[aw].shop;
  let tot=0,don=0;
  for(const[cat,items]of Object.entries(shop)){
    items.forEach((_,i)=>{tot++;if(chk[key][`${key}-${cat}-${i}`])don++;});
  }
  const pc=document.getElementById('pcnt');
  const pf=document.getElementById('pfill');
  if(pc) pc.textContent=`${don} / ${tot}`;
  if(pf) pf.style.width=`${Math.round(don/tot*100)}%`;
}

function clearShop(){chk[`w${aw}`]={};saveState();renderShopTab();}

init();
</script>
